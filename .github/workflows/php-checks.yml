name: PHP modernization checks

on:
  push:
    branches: [master, modernization]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite
          coverage: none
      - name: Lint modernized PHP
        run: find modernized -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run smoke tests
        run: php modernized/tests/smoke.php
      - name: Run performance comparison
        run: php modernized/tests/performance.php

